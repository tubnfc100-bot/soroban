<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bàn Tính Soroban</title>
<meta name="description" content="Học bàn tính Soroban Nhật Bản qua 10 cấp độ, có hướng dẫn cho phụ huynh và luyện tính nhẩm.">
<meta name="theme-color" content="#4E321D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Soroban">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: một cột trung tâm (tối đa 1080px). Bàn tính gỗ là "nhân vật chính" — màu gỗ giữ nguyên ở cả hai chế độ sáng/tối,
   giao diện xung quanh dùng giấy washi xanh xám + mực chàm (ai-iro) làm màu nhấn. */
:root {
  --paper: #EBEFF3;
  --surface: #FFFFFF;
  --surface-2: #F5F7FA;
  --ink: #1B2336;
  --muted: #5A6377;
  --line: #D3D9E2;
  --ai: #2B4893;
  --on-ai: #FFFFFF;
  --ai-soft: #DCE3F4;
  --good: #1F7F55;
  --good-soft: #DAF0E4;
  --bad: #B03E2E;
  --bad-soft: #F6DFDA;
  --gold: #D6961A;
  --gold-soft: #FBEFD3;
  /* Gỗ bàn tính — cố định ở mọi chế độ */
  --wood-hi: #6B4629;
  --wood: #4E321D;
  --wood-lo: #2F1D10;
  --beam: #231509;
  --rod: #CDB894;
  --bead-hi: #F4D8A3;
  --bead: #D49B4E;
  --bead-lo: #8A5620;
  --dot: #F4E6C8;
  /* Bàn tay — cố định ở mọi chế độ */
  --skin: #F3CDA6;
  --skin-lo: #D9AB84;
  --skin-line: #A8744C;
  --nail: #FCE9DA;
  /* Màu nhận diện hai tay: trái = chàm, phải = hổ phách */
  --hand-l: #3D5FB8;
  --hand-l-soft: #DFE6F7;
  --hand-r: #A8620F;
  --hand-r-soft: #FBEBD2;

  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;

  --r-sm: 8px;
  --r-md: 14px;
  --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 6px 20px rgba(20, 30, 60, .07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161F; --surface: #1A202C; --surface-2: #212838; --ink: #E6E9F0; --muted: #9AA3B5; --line: #2D3547;
    --ai: #93A9EC; --on-ai: #0F1528; --ai-soft: #25304B; --good: #62C796; --good-soft: #163527; --bad: #EE8A78;
    --bad-soft: #3B201B; --gold: #F0B948; --gold-soft: #3A2E14;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --hand-l: #9DB3F0; --hand-l-soft: #26325A; --hand-r: #F2B25C; --hand-r-soft: #3D2C12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161F; --surface: #1A202C; --surface-2: #212838; --ink: #E6E9F0; --muted: #9AA3B5; --line: #2D3547;
  --ai: #93A9EC; --on-ai: #0F1528; --ai-soft: #25304B; --good: #62C796; --good-soft: #163527; --bad: #EE8A78;
  --bad-soft: #3B201B; --gold: #F0B948; --gold-soft: #3A2E14;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  --hand-l: #9DB3F0; --hand-l-soft: #26325A; --hand-r: #F2B25C; --hand-r-soft: #3D2C12;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
}
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ai); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }

/* ---------- Thanh trên ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(180deg, var(--wood-hi), var(--wood-lo)); display: grid; place-items: center; }
.brand-mark span { width: 18px; height: 10px; background: linear-gradient(180deg, var(--bead-hi), var(--bead) 55%, var(--bead-lo)); clip-path: polygon(22% 0, 78% 0, 100% 50%, 78% 100%, 22% 100%, 0 50%); }
.brand b { font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .92rem; color: var(--muted); }
.nav button:hover { color: var(--ink); background: var(--surface-2); }
.nav button[aria-current="page"] { color: var(--ai); background: var(--ai-soft); }
.star-total { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; padding-inline: 6px; }

main { padding-block: 24px 64px; }

/* ---------- Nút ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; cursor: pointer; font-weight: 700; font-size: 1rem;
  padding: 11px 20px; border-radius: 999px; background: var(--ai); color: var(--on-ai);
  transition: transform .12s ease, filter .12s ease;
  min-height: 44px;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px) scale(.98); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--ai); }
.btn.soft { background: var(--ai-soft); color: var(--ai); }
.btn.good { background: var(--good); color: var(--surface); }
.btn.small { padding: 6px 14px; font-size: .88rem; min-height: 36px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- Trang chủ ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 12px 36px; }
.hero-jp { font-size: .95rem; letter-spacing: .3em; color: var(--muted); font-weight: 600; }
.hero h1 { font-size: clamp(2.3rem, 5.5vw, 3.6rem); font-weight: 800; margin-block: 6px 12px; }
.hero h1 em { font-style: normal; color: var(--ai); }
.hero p.lead { font-size: 1.08rem; color: var(--muted); max-width: 52ch; margin-bottom: 20px; }
.hero-abacus { display: grid; justify-items: center; gap: 10px; }
.hero-note { font-size: .85rem; color: var(--muted); text-align: center; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-block: 8px 16px; flex-wrap: wrap; }
.section-head h2 { font-size: 1.7rem; }
.section-head p { color: var(--muted); font-size: .95rem; }

.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.level-card {
  position: relative; text-align: left; cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-md);
  padding: 16px 16px 14px; display: grid; gap: 6px; box-shadow: var(--shadow);
  transition: transform .15s ease, border-color .15s ease;
}
.level-card:hover { transform: translateY(-2px); border-color: var(--ai); }
.level-card.locked { cursor: not-allowed; opacity: .6; box-shadow: none; }
.level-card.locked:hover { transform: none; border-color: var(--line); }
.level-card.next { border-color: var(--ai); }
.lc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lc-num { font-family: var(--font-display); font-weight: 800; font-size: 2rem; line-height: 1; color: var(--ai); font-variant-numeric: tabular-nums; }
.lc-kyu { font-size: .78rem; font-weight: 700; letter-spacing: .06em; color: var(--muted); background: var(--surface-2); padding: 2px 8px; border-radius: 999px; }
.lc-name { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; }
.lc-desc { font-size: .88rem; color: var(--muted); line-height: 1.45; }
.lc-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: .82rem; color: var(--muted); }
.stars { color: var(--gold); letter-spacing: 2px; font-size: 1.05rem; }
.stars .off { color: var(--line); }
.tag-next { font-size: .75rem; font-weight: 700; color: var(--on-ai); background: var(--ai); padding: 2px 8px; border-radius: 999px; }

.home-extra { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 28px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.panel h3 { font-size: 1.25rem; margin-bottom: 6px; }
.panel p { color: var(--muted); font-size: .95rem; margin-bottom: 12px; }

/* ---------- Bàn tính ---------- */
.abacus { --bw: clamp(30px, 8.6vw, 52px); --bh: calc(var(--bw) * .5); --pad: 5px; display: inline-grid; gap: 6px; max-width: 100%; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.abacus.big { --bw: clamp(34px, 11vw, 60px); }
.ab-frame {
  background: linear-gradient(180deg, var(--wood-hi), var(--wood) 30%, var(--wood-lo));
  border-radius: 12px; padding: 12px 12px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.35), 0 10px 24px rgba(40, 20, 5, .28);
}
.ab-cols { display: flex; background: rgba(0,0,0,.18); border-radius: 6px; padding-inline: 4px; }
.ab-col { position: relative; width: calc(var(--bw) + var(--pad) * 2); padding-inline: var(--pad); display: flex; flex-direction: column; border-radius: 6px; cursor: pointer; }
.ab-col:focus-visible { outline: 3px solid var(--bead-hi); outline-offset: -2px; }
.ab-heaven, .ab-earth { position: relative; }
.ab-heaven { height: calc(var(--bh) * 2 + 6px); }
.ab-earth { height: calc(var(--bh) * 5 + 6px); }
.ab-heaven::before, .ab-earth::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; transform: translateX(-50%); background: linear-gradient(90deg, #9d8a6b, var(--rod), #9d8a6b); }
.ab-beam { position: relative; height: 12px; margin-inline: calc(var(--pad) * -1); background: linear-gradient(180deg, #3a2615, var(--beam)); box-shadow: 0 1px 0 rgba(255,255,255,.1); }
.ab-dot { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: var(--dot); transform: translate(-50%, -50%); }
.bead {
  position: absolute; left: var(--pad); right: var(--pad); height: calc(var(--bh) - 2px);
  background: linear-gradient(180deg, var(--bead-hi) 0%, var(--bead) 45%, var(--bead-lo) 100%);
  clip-path: polygon(20% 0, 80% 0, 100% 50%, 80% 100%, 20% 100%, 0 50%);
  transition: top .16s cubic-bezier(.3, .7, .4, 1);
  cursor: pointer;
}
.bead::after { content: ""; position: absolute; left: 30%; right: 30%; top: 14%; height: 18%; border-radius: 50%; background: rgba(255,255,255,.35); }
.bead.h { top: 3px; }
.bead.h.on { top: calc(var(--bh) + 3px); }
.bead.e { top: calc(3px + (var(--k) + 1) * var(--bh)); }
.bead.e.on { top: calc(3px + var(--k) * var(--bh)); }
.abacus.hl .bead.on { filter: saturate(1.25) brightness(1.05); }
.ab-col.flash { background: rgba(255, 230, 170, .22); }
.abacus.locked .ab-col, .abacus.locked .bead { cursor: default; }
.ab-labels { display: flex; padding-inline: 16px; }
.ab-labels span { width: calc(var(--bw) + var(--pad) * 2); text-align: center; font-size: .68rem; color: var(--muted); font-weight: 600; line-height: 1.2; }
.ab-value { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink); min-height: 2.2rem; }
.ab-value.hidden-val { color: var(--muted); font-size: 1rem; font-weight: 600; font-family: var(--font-body); display: grid; place-items: center; }

/* ---------- Trang cấp độ ---------- */
.crumb { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); font-weight: 600; cursor: pointer; padding: 4px 0; margin-bottom: 10px; }
.crumb:hover { color: var(--ai); }
.level-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px; }
.level-head .eyebrow { font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ai); }
.level-head h1 { font-size: clamp(1.9rem, 4.5vw, 2.6rem); font-weight: 800; margin-block: 2px 6px; }
.level-head p { color: var(--muted); }
.tabs { display: flex; gap: 6px; border-bottom: 1.5px solid var(--line); margin-bottom: 22px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 10px 14px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1.5px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ai); border-bottom-color: var(--ai); }

.lessons { display: grid; gap: 16px; }
.lesson { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px; box-shadow: var(--shadow); }
.lesson.no-demo { grid-template-columns: minmax(0, 1fr); }
.lesson-step { font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lesson h3 { font-size: 1.35rem; margin-block: 2px 8px; }
.lesson .body { display: grid; gap: 8px; max-width: 62ch; }
.lesson .body b { color: var(--ai); }
.demo { display: grid; justify-items: center; gap: 10px; min-width: 0; }
.demo-caption { min-height: 3em; max-width: 34ch; text-align: center; font-size: .92rem; font-weight: 600; color: var(--ink); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: 100%; max-width: 44ch; font-size: .88rem; }
.steps li { padding: 6px 10px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--muted); border-left: 3px solid transparent; }
.steps li.head { background: none; font-weight: 700; color: var(--ink); padding-left: 0; }
.steps li.cur { color: var(--ink); background: var(--ai-soft); border-left-color: var(--ai); }
.steps li.done { color: var(--ink); }

.mini-table { border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 4px; }
.mini-table td, .mini-table th { border: 1px solid var(--line); padding: 4px 12px; text-align: center; }
.mini-table th { background: var(--surface-2); font-weight: 700; font-size: .85rem; }
.table-scroll { overflow-x: auto; max-width: 100%; }

/* Hướng dẫn phụ huynh */
.guide { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.guide .panel h3 { display: flex; align-items: center; gap: 8px; }
.guide ol, .guide ul, .article ol, .article ul { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.guide .full { grid-column: 1 / -1; }
.quote-list { list-style: none !important; padding: 0 !important; }
.quote-list li { background: var(--gold-soft); border-radius: var(--r-sm); padding: 8px 12px; font-style: italic; }
.pill { display: inline-block; font-size: .78rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--ai-soft); color: var(--ai); }

/* ---------- Luyện tập ---------- */
.practice { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; justify-items: center; }
.pbar { width: 100%; max-width: 640px; display: grid; gap: 6px; }
.pbar-top { display: flex; justify-content: space-between; font-size: .88rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.pbar-track { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.pbar-fill { height: 100%; background: var(--ai); border-radius: 999px; transition: width .3s ease; }
.qcard { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 22px 20px; box-shadow: var(--shadow); display: grid; gap: 16px; justify-items: center; text-align: center; }
.q-label { font-size: .9rem; font-weight: 700; color: var(--muted); }
.q-number { font-family: var(--font-display); font-weight: 800; font-size: clamp(3rem, 12vw, 4.6rem); line-height: 1; font-variant-numeric: tabular-nums; }
.q-words { color: var(--muted); font-size: .95rem; margin-top: -8px; }
.q-expr { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 9vw, 3.4rem); line-height: 1.1; font-variant-numeric: tabular-nums; }
.q-expr .qm { color: var(--ai); }
.q-column { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.2; font-variant-numeric: tabular-nums; border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 8px 18px; display: grid; justify-items: end; min-width: 140px; }
.q-column .rule { width: 100%; border-top: 2px solid var(--ink); margin-top: 4px; padding-top: 2px; text-align: right; color: var(--ai); }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 360px; }
.opt { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; padding: 8px; border-radius: var(--r-md); border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-variant-numeric: tabular-nums; }
.opt:hover { border-color: var(--ai); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.opt.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.feedback { min-height: 1.6em; font-weight: 700; font-size: 1.05rem; padding: 8px 14px; border-radius: var(--r-sm); width: 100%; }
.feedback:empty { padding: 0; }
.feedback.ok { background: var(--good-soft); color: var(--good); }
.feedback.no { background: var(--bad-soft); color: var(--bad); }
.feedback.info { background: var(--ai-soft); color: var(--ai); }
.hint-box { width: 100%; text-align: left; background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; display: grid; gap: 8px; }
.hint-box h4 { font-size: 1rem; }

.flash-stage { width: 100%; min-height: 200px; display: grid; place-items: center; background: var(--surface-2); border-radius: var(--r-md); }
.flash-num { font-family: var(--font-display); font-weight: 800; font-size: clamp(4rem, 18vw, 7rem); line-height: 1; font-variant-numeric: tabular-nums; }
.flash-num.minus { color: var(--bad); }
.flash-num.plus { color: var(--ai); }
.flash-num.pop { animation: pop .22s ease-out; }
@keyframes pop { from { transform: scale(.7); opacity: .2; } to { transform: scale(1); opacity: 1; } }
.answer-input { font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; width: 180px; max-width: 100%; text-align: center; border: 2px solid var(--line); border-radius: var(--r-md); padding: 4px 8px; background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums; }
.answer-input:focus { border-color: var(--ai); outline: none; }
.keypad { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; }
.keypad button { height: 52px; border-radius: var(--r-sm); border: 1.5px solid var(--line); background: var(--surface); font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; cursor: pointer; }
.keypad button:hover { border-color: var(--ai); }
.keypad .ok { background: var(--ai); color: var(--on-ai); border-color: var(--ai); font-size: 1rem; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: .88rem; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ai); box-shadow: var(--shadow); }

.result { text-align: center; display: grid; gap: 14px; justify-items: center; }
.result .big-stars { font-size: 3.4rem; letter-spacing: 8px; line-height: 1; }
.result .big-stars span { display: inline-block; color: var(--line); }
.result .big-stars span.on { color: var(--gold); animation: starIn .5s cubic-bezier(.2, 1.6, .5, 1) both; }
.result .big-stars span:nth-child(2) { animation-delay: .25s; }
.result .big-stars span:nth-child(3) { animation-delay: .5s; }
@keyframes starIn { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
.result h2 { font-size: 2rem; }
.result .score { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Bài viết phụ huynh ---------- */
.article { display: grid; gap: 16px; }
.article .panel p { color: var(--ink); margin-bottom: 10px; }
.article .panel p:last-child { margin-bottom: 0; }
.article h2 { font-size: 1.45rem; margin-bottom: 10px; }
.article .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.data-table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.data-table th, .data-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.data-table th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.data-table td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.confirm { background: var(--bad-soft); color: var(--bad); border-radius: var(--r-sm); padding: 12px; display: grid; gap: 10px; }
.switch-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 8px; border-bottom: 1px solid var(--line); }
.switch-row:last-child { border-bottom: 0; }

.free { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 20px; align-items: start; }
.free-board { display: grid; justify-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 24px 12px; box-shadow: var(--shadow); min-width: 0; }
.field { display: grid; gap: 4px; font-size: .85rem; font-weight: 600; color: var(--muted); }
.field input, .field select { font: inherit; font-size: 1.1rem; font-weight: 700; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 6px 10px; width: 100%; }
.calc-form { display: grid; grid-template-columns: 1fr 70px 1fr; gap: 8px; align-items: end; }

/* ---------- Chế độ 2 tay ---------- */
.hand-tag { display: inline-block; font-size: .78em; font-weight: 700; padding: 0 7px; border-radius: 999px; line-height: 1.55; white-space: nowrap; }
.hand-tag.L { background: var(--hand-l-soft); color: var(--hand-l); }
.hand-tag.R { background: var(--hand-r-soft); color: var(--hand-r); }
.abacus.two-hands .ab-col[data-hand="L"] { background: rgba(110, 150, 255, .16); }
.abacus.two-hands .ab-col[data-hand="R"] { background: rgba(255, 190, 100, .16); }
.abacus.two-hands .ab-col.flash { background: rgba(255, 230, 170, .38); }
.ab-labels small { display: block; font-size: .95em; font-weight: 700; }
.ab-labels small.L { color: var(--hand-l); }
.ab-labels small.R { color: var(--hand-r); }
.mode-toggle { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px 5px 6px; font-weight: 700; font-size: .88rem; cursor: pointer; min-height: 36px; }
.mode-toggle:hover { border-color: var(--ai); }
.mode-toggle .sw { width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.mode-toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.mode-toggle[aria-pressed="true"] .sw { background: var(--ai); }
.mode-toggle[aria-pressed="true"] .sw::after { transform: translateX(14px); }
.head-side { display: grid; justify-items: end; gap: 8px; }

/* ---------- Bàn tay ---------- */
.hands { display: grid; justify-items: center; user-select: none; -webkit-user-select: none; touch-action: manipulation; max-width: 100%; }
.hands-row { display: flex; gap: clamp(6px, 3vw, 22px); align-items: flex-end; }
.hand { display: grid; justify-items: center; gap: 2px; border-radius: var(--r-md); padding: 6px; transition: background .2s; }
.hand.flash { background: var(--ai-soft); }
.hand svg { width: clamp(108px, 32vw, 150px); height: auto; display: block; overflow: visible; }
.hand-label { font-size: .78rem; font-weight: 600; color: var(--muted); text-align: center; line-height: 1.35; }
.hand-digit { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.hands .fg { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .2s cubic-bezier(.3, .7, .4, 1); }
.hands .fg rect { fill: var(--skin-lo); stroke: var(--skin-line); stroke-width: 1.5; }
.hands .fg.up rect { fill: var(--skin); }
.hands .fg .nail { fill: var(--nail); opacity: 0; transition: opacity .15s; }
.hands .fg.up .nail { opacity: 1; }
.hands .fg:not(.up) { transform: scaleY(.36); }
.hands .fg.th:not(.up) { transform: rotate(64deg); }
.hands .fg.th.up { transform: rotate(-34deg); }
.hands .palm { fill: var(--skin); stroke: var(--skin-line); stroke-width: 1.5; }
.hands .hit { fill: transparent; cursor: pointer; }
.hands.locked .hit { cursor: default; }

/* ---------- Trang tính nhẩm ---------- */
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px; display: grid; gap: 6px; align-content: start; box-shadow: var(--shadow); }
.stage-n { font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; color: var(--ai); line-height: 1; }
.stage h3 { font-size: 1.15rem; }
.stage p { color: var(--muted); font-size: .92rem; }
.stage .pill { justify-self: start; }
.duo { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; align-items: flex-end; }
.flash-wrap { position: relative; }
.flash-cover { position: absolute; inset: 0; display: grid; place-items: center; background: var(--surface-2); border: 2px dashed var(--line); border-radius: 12px; font-family: var(--font-display); font-size: 3rem; font-weight: 800; color: var(--muted); }
.center-col { display: grid; justify-items: center; gap: 12px; text-align: center; }

/* ---------- Cài đặt ứng dụng ---------- */
#install { scroll-margin-top: 120px; }
.install-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 6px; }
.install-steps h3 { font-size: 1.05rem; margin-bottom: 6px; }
.install-steps ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: .94rem; }
.status-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; margin-bottom: 12px; font-weight: 600; }
.status-line.ok { background: var(--good-soft); color: var(--good); }
.key { display: inline-block; border: 1.5px solid var(--line); border-radius: 6px; padding: 0 6px; font-weight: 700; font-size: .88em; background: var(--surface); }

.footer { color: var(--muted); font-size: .82rem; text-align: center; padding-block: 24px; }

@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .lesson { grid-template-columns: minmax(0, 1fr); }
  .guide { grid-template-columns: minmax(0, 1fr); }
  .free { grid-template-columns: minmax(0, 1fr); }
  .nav button { padding: 6px 8px; font-size: .84rem; }
  .nav { gap: 0; }
  .star-total { margin-left: auto; }
  .nav { order: 3; width: 100%; margin-left: 0; justify-content: space-between; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

  </div>

<main class="wrap" id="app"></main>
<footer class="footer wrap">Bàn Tính Soroban · Học tính toán theo phương pháp Nhật Bản · Tiến độ được lưu trên trình duyệt này</footer>

<script>
"use strict";

/* =========================================================
   Tiện ích
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PLACE = ['đơn vị', 'chục', 'trăm', 'nghìn', 'chục nghìn', 'trăm nghìn', 'triệu'];
const PLACE_LABEL = ['Đơn vị', 'Chục', 'Trăm', 'Nghìn', 'Ch.nghìn', 'Tr.nghìn', 'Triệu'];
const W = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];

function readVi(n) {
  if (n < 10) return W[n];
  if (n < 100) {
    const t = Math.floor(n / 10), u = n % 10;
    const tens = t === 1 ? 'mười' : W[t] + ' mươi';
    if (u === 0) return tens;
    if (u === 1 && t > 1) return tens + ' mốt';
    if (u === 5) return tens + ' lăm';
    if (u === 4 && t > 1) return tens + ' tư';
    return tens + ' ' + W[u];
  }
  if (n < 1000) {
    const h = Math.floor(n / 100), r = n % 100;
    if (r === 0) return W[h] + ' trăm';
    if (r < 10) return W[h] + ' trăm linh ' + W[r];
    return W[h] + ' trăm ' + readVi(r);
  }
  return String(n);
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const toDigits = (n, len) => { const d = []; for (let i = 0; i < len; i++) { d.push(n % 10); n = Math.floor(n / 10); } return d; };
const fromDigits = d => d.reduce((s, x, i) => s + x * Math.pow(10, i), 0);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const starsHtml = (n, total = 3) => `<span class="stars" aria-label="${n} trên ${total} sao">${'★'.repeat(n)}<span class="off">${'★'.repeat(total - n)}</span></span>`;
const fmtOp = (sign, n) => (sign > 0 ? '+' : '−') + n;

/* =========================================================
   Âm thanh (chỉ phát sau khi người dùng bấm)
   ========================================================= */
const Sound = {
  ctx: null,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  tone(freq, dur, type = 'sine', vol = .08, delay = 0) {
    if (!progress.sound) return;
    const ctx = this.ensure(); if (!ctx) return;
    const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + .02);
  },
  click() { this.tone(1500, .035, 'square', .025); this.tone(700, .05, 'triangle', .04); },
  good() { this.tone(660, .14, 'sine', .09); this.tone(880, .22, 'sine', .09, .12); },
  bad() { this.tone(240, .22, 'triangle', .09); this.tone(180, .25, 'triangle', .07, .12); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .22, 'sine', .08, i * .13)); }
};

/* =========================================================
   Lưu tiến độ (localStorage — có thể không khả dụng)
   ========================================================= */
const STORE_KEY = 'soroban-progress-v1';
function loadProgress() {
  let d = {};
  try { d = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { d = {}; }
  d = Object.assign({ levels: {}, sound: true, unlockAll: false, speed: 'slow', twoHands: false, flashBest: 0 }, d);
  if (!d.ver) {
    // Phiên bản 2 chèn cấp "Bàn tính trên hai bàn tay" vào vị trí 8: dời số sao của cấp Anzan cũ
    const L = d.levels;
    if (L[9]) L[10] = L[9];
    if (L[8]) L[9] = L[8];
    delete L[8];
    d.ver = 2;
  }
  return d;
}
function saveProgress() { try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) { /* bỏ qua */ } }
let progress = loadProgress();

/* =========================================================
   Bàn tính
   ========================================================= */
class Abacus {
  constructor(el, opts = {}) {
    this.el = el;
    this.rods = opts.rods || 3;
    this.interactive = opts.interactive !== false;
    this.onChange = opts.onChange || (() => {});
    this.labels = opts.labels !== false;
    this.big = !!opts.big;
    this.hands = opts.hands ?? progress.twoHands;
    this.digits = new Array(this.rods).fill(0);
    this.build();
    if (opts.value) this.setValue(opts.value, true);
  }
  build() {
    const cols = [];
    for (let i = this.rods - 1; i >= 0; i--) {
      let earth = '';
      for (let k = 0; k < 4; k++) earth += `<div class="bead e" data-rod="${i}" data-b="${k}" style="--k:${k}"></div>`;
      cols.push(`<div class="ab-col" data-rod="${i}" data-hand="${i === 0 ? 'R' : 'L'}" tabindex="${this.interactive ? 0 : -1}" role="group" aria-label="Cột ${PLACE[i]}">
        <div class="ab-heaven"><div class="bead h" data-rod="${i}" data-b="h"></div></div>
        <div class="ab-beam">${i % 3 === 0 ? '<span class="ab-dot"></span>' : ''}</div>
        <div class="ab-earth">${earth}</div></div>`);
    }
    const labels = [];
    for (let i = this.rods - 1; i >= 0; i--) labels.push(`<span>${PLACE_LABEL[i] || ''}${this.hands ? `<small class="${i === 0 ? 'R' : 'L'}">Tay ${i === 0 ? 'phải' : 'trái'}</small>` : ''}</span>`);
    this.el.innerHTML = `<div class="abacus${this.big ? ' big' : ''}${this.interactive ? '' : ' locked'}${this.hands ? ' two-hands' : ''}">
      <div class="ab-frame"><div class="ab-cols">${cols.join('')}</div></div>
      ${this.labels ? `<div class="ab-labels" aria-hidden="true">${labels.join('')}</div>` : ''}</div>`;
    this.root = this.el.firstElementChild;
    this.root.addEventListener('click', e => this.handleClick(e));
    this.root.addEventListener('keydown', e => this.handleKey(e));
    this.render();
  }
  setInteractive(v) {
    this.interactive = v;
    this.root.classList.toggle('locked', !v);
    this.root.querySelectorAll('.ab-col').forEach(c => c.tabIndex = v ? 0 : -1);
  }
  handleClick(e) {
    if (!this.interactive) return;
    const b = e.target.closest('.bead'); if (!b) return;
    const i = +b.dataset.rod; let d = this.digits[i];
    let h = d >= 5, c = d % 5;
    if (b.dataset.b === 'h') h = !h;
    else { const k = +b.dataset.b; c = k < c ? k : k + 1; }
    this.setDigit(i, (h ? 5 : 0) + c);
  }
  handleKey(e) {
    if (!this.interactive) return;
    const col = e.target.closest('.ab-col'); if (!col) return;
    const i = +col.dataset.rod, d = this.digits[i];
    if (e.key === 'ArrowUp') { e.preventDefault(); this.setDigit(i, Math.min(9, d + 1)); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); this.setDigit(i, Math.max(0, d - 1)); }
    else if (/^[0-9]$/.test(e.key)) { e.preventDefault(); this.setDigit(i, +e.key); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      const next = this.root.querySelector(`.ab-col[data-rod="${i + (e.key === 'ArrowLeft' ? 1 : -1)}"]`);
      if (next) next.focus();
    }
  }
  setDigit(i, v, silent) {
    if (this.digits[i] === v) return;
    this.digits[i] = v;
    this.render();
    if (!silent) { Sound.click(); this.onChange(this.getValue()); }
  }
  setDigits(arr) { for (let i = 0; i < this.rods; i++) this.digits[i] = arr[i] || 0; this.render(); }
  setValue(n, silent) { this.setDigits(toDigits(n, this.rods)); if (!silent) this.onChange(this.getValue()); }
  getValue() { return fromDigits(this.digits); }
  flashRod(i) {
    this.root.querySelectorAll('.ab-col.flash').forEach(c => c.classList.remove('flash'));
    if (i == null) return;
    const c = this.root.querySelector(`.ab-col[data-rod="${i}"]`); if (c) c.classList.add('flash');
  }
  render() {
    this.root.querySelectorAll('.ab-col').forEach(col => {
      const i = +col.dataset.rod, d = this.digits[i];
      col.querySelector('.bead.h').classList.toggle('on', d >= 5);
      col.querySelectorAll('.bead.e').forEach(b => b.classList.toggle('on', +b.dataset.b < d % 5));
      col.setAttribute('aria-label', `Cột ${PLACE[i]}: ${d}`);
    });
  }
}

/* =========================================================
   Bàn tính trên hai bàn tay: tay phải = cột đơn vị, tay trái = cột chục.
   Ngón cái = hạt trên (5), bốn ngón còn lại = bốn hạt dưới (mỗi ngón 1).
   Cùng giao diện với Abacus để dùng chung cho minh họa và luyện tập.
   ========================================================= */
class Hands {
  constructor(el, opts = {}) {
    this.el = el; this.rods = 2;
    this.interactive = opts.interactive !== false;
    this.showDigits = opts.showDigits !== false;
    this.onChange = opts.onChange || (() => {});
    this.digits = [0, 0];
    this.build();
    if (opts.value) this.setValue(opts.value, true);
  }
  handSvg(idx) {
    const fingers = [[36, 22], [56, 12], [76, 20], [96, 36]].map(([x, y], k) =>
      `<g class="fg" data-hand="${idx}" data-f="${k}"><rect x="${x}" y="${y}" width="18" height="${106 - y}" rx="9"/><ellipse class="nail" cx="${x + 9}" cy="${y + 10}" rx="5" ry="6"/></g>`).join('');
    const hits = [[36, 12], [56, 4], [76, 12], [96, 28]].map(([x, y], k) =>
      `<rect class="hit" data-hand="${idx}" data-f="${k}" x="${x - 1}" y="${y}" width="20" height="${88 - y}"/>`).join('');
    const thumb = `<g class="fg th" data-hand="${idx}" data-f="t"><rect x="24" y="74" width="21" height="58" rx="10.5"/><ellipse class="nail" cx="34.5" cy="85" rx="5.5" ry="6.5"/></g>`;
    const inner = `${fingers}<rect class="palm" x="32" y="86" width="86" height="74" rx="24"/>${thumb}${hits}<rect class="hit" data-hand="${idx}" data-f="t" x="0" y="56" width="32" height="60"/>`;
    return `<svg viewBox="-4 0 158 164" aria-hidden="true">${idx === 1 ? `<g transform="translate(150,0) scale(-1,1)">${inner}</g>` : inner}</svg>`;
  }
  build() {
    this.el.innerHTML = `<div class="hands${this.interactive ? '' : ' locked'}"><div class="hands-row">${[1, 0].map(i => `
      <div class="hand" data-hi="${i}" role="group" tabindex="${this.interactive ? 0 : -1}" aria-label="${i ? 'Tay trái, cột chục' : 'Tay phải, cột đơn vị'}">
        ${this.showDigits ? `<div class="hand-digit" data-hd="${i}">0</div>` : ''}
        ${this.handSvg(i)}
        <div class="hand-label"><span class="hand-tag ${i ? 'L' : 'R'}">Tay ${i ? 'trái' : 'phải'}</span><br>${i ? 'Chục' : 'Đơn vị'}</div>
      </div>`).join('')}</div></div>`;
    this.root = this.el.firstElementChild;
    this.root.addEventListener('click', e => this.handleClick(e));
    this.root.addEventListener('keydown', e => this.handleKey(e));
    this.render();
  }
  setInteractive(v) {
    this.interactive = v;
    this.root.classList.toggle('locked', !v);
    this.root.querySelectorAll('.hand').forEach(h => h.tabIndex = v ? 0 : -1);
  }
  handleClick(e) {
    if (!this.interactive) return;
    const f = e.target.closest('[data-f]'); if (!f) return;
    const i = +f.dataset.hand, d = this.digits[i];
    let h = d >= 5, c = d % 5;
    if (f.dataset.f === 't') h = !h;
    else { const k = +f.dataset.f; c = k < c ? k : k + 1; }

/* =========================================================
   "Bộ não" Soroban: tách một phép tính thành từng bước gạt hạt
   (trực tiếp, bạn nhỏ = hợp 5, bạn lớn = hợp 10, kết hợp)
   ========================================================= */
function canAddDirect(d, n) { if (d + n > 9) return false; if (d >= 5 && n >= 5) return false; return (d % 5) + (n % 5) <= 4; }
function canSubDirect(d, n) { if (d < n) return false; if (n >= 5 && d < 5) return false; return (d % 5) >= (n % 5); }
const handTag = p => `<span class="hand-tag ${p === 0 ? 'R' : 'L'}">Tay ${p === 0 ? 'phải' : 'trái'}</span>`;
/* Ba "cách nói" cho cùng một bước: bàn tính 1 tay, bàn tính 2 tay, và bàn tay (ngón tay) */
const VOCAB = {
  abacus: {
    col: p => `Cột ${PLACE[p]}`, at: p => `ở cột ${PLACE[p]}`, start: 'bàn tính',
    up5: 'gạt hạt trên xuống', upK: k => `đẩy ${k} hạt dưới lên`, dn5: 'gạt hạt trên lên', dnK: k => `kéo ${k} hạt dưới xuống`,
    lack: 'không đủ hạt dưới', lackAll: 'không đủ hạt', carry: '', borrow: ''
  },
  twohand: {
    col: p => `${handTag(p)} cột ${PLACE[p]}`, at: p => `ở cột ${PLACE[p]}`, start: 'bàn tính',
    up5: 'ngón trỏ gạt hạt trên xuống', upK: k => `ngón cái đẩy ${k} hạt dưới lên`, dn5: 'ngón trỏ gạt hạt trên lên', dnK: k => `ngón trỏ kéo ${k} hạt dưới xuống`,
    lack: 'không đủ hạt dưới', lackAll: 'không đủ hạt',
    carry: ' <i>Hai tay làm cùng lúc: tay phải bớt, tay trái nhớ 1.</i>',
    borrow: ' <i>Hai tay làm cùng lúc: tay trái mượn 1, tay phải thêm bạn lớn.</i>'
  },
  fingers: {
    col: p => p === 0 ? `${handTag(0)} (đơn vị)` : p === 1 ? `${handTag(1)} (chục)` : `Cột ${PLACE[p]}`, at: p => p === 0 ? 'ở tay phải' : 'ở tay trái', start: 'hai bàn tay',
    up5: 'mở ngón cái', upK: k => `mở thêm ${k} ngón`, dn5: 'gập ngón cái', dnK: k => `gập ${k} ngón`,
    lack: 'không đủ ngón', lackAll: 'không đủ ngón', carry: '', borrow: ''
  }

function movesAdd(n, V) { const p = []; if (n >= 5) p.push(V.up5); if (n % 5) p.push(V.upK(n % 5)); return p.join(' và '); }
function movesSub(n, V) { const p = []; if (n >= 5) p.push(V.dn5); if (n % 5) p.push(V.dnK(n % 5)); return p.join(' và '); }

function planCalc(start, ops, rods = 5, vocab = 'abacus') {
  const V = VOCAB[vocab] || VOCAB.abacus;
  const v = toDigits(start, rods + 2);
  const steps = [], kinds = new Set();
  const push = (text, kind, rod) => { steps.push({ text, kind, rod, digits: v.slice() }); if (kind && kind !== 'head') kinds.add(kind); };

  function add(p, n, prefix = '') {
    const d = v[p], col = V.col(p);
    if (d + n <= 9) {
      if (canAddDirect(d, n)) { v[p] += n; push(`${prefix}${col}: +${n} → ${movesAdd(n, V)}.`, 'direct', p); }
      else { v[p] += n; push(`${prefix}${col}: +${n} nhưng ${V.lack} → <b>bạn nhỏ</b>: +${n} = +5 − ${5 - n}. ${cap(V.up5)}, ${V.dnK(5 - n)}.`, 'five', p); }
    } else {
      const c = 10 - n, direct = canSubDirect(d, c);
      const inner = direct ? `bớt ${c}: ${movesSub(c, V)}` : `bớt ${c} bằng bạn nhỏ (−${c} = +${5 - c} − 5): ${V.upK(5 - c)}, ${V.dn5}`;
      v[p] -= c;
      push(`${prefix}${col}: +${n} vượt quá 9 → <b>bạn lớn</b>: +${n} = −${c} + 10. ${cap(V.at(p))} ${inner}.${p === 0 ? V.carry : ''}`, 'ten', p);
      if (!direct) kinds.add('mixed');
      add(p + 1, 1, 'Nhớ 1 → ');
    }
  }
  function sub(p, n, prefix = '') {
    const d = v[p], col = V.col(p);
    if (d >= n) {
      if (canSubDirect(d, n)) { v[p] -= n; push(`${prefix}${col}: −${n} → ${movesSub(n, V)}.`, 'direct', p); }
      else { v[p] -= n; push(`${prefix}${col}: −${n} nhưng ${V.lack} → <b>bạn nhỏ</b>: −${n} = +${5 - n} − 5. ${cap(V.upK(5 - n))}, ${V.dn5}.`, 'five', p); }
    } else {
      const c = 10 - n;
      push(`${prefix}${col}: −${n} nhưng ${V.lackAll} → <b>bạn lớn</b>: −${n} = −10 + ${c}.${p === 0 ? V.borrow : ''}`, 'ten', p);
      sub(p + 1, 1, 'Mượn 1 → ');
      const d2 = v[p];
      if (canAddDirect(d2, c)) { v[p] += c; push(`${col}: thêm bạn lớn ${c} → ${movesAdd(c, V)}.`, 'ten', p); }
      else { v[p] += c; kinds.add('mixed'); push(`${col}: thêm bạn lớn ${c} bằng bạn nhỏ (+${c} = +5 − ${5 - c}): ${V.up5}, ${V.dnK(5 - c)}.`, 'ten', p); }
    }
  }

  steps.push({ text: `Bắt đầu: ${V.start} có số ${start}.`, kind: 'head', rod: null, digits: v.slice() });
  ops.forEach(({ sign, n }) => {
    push(`${sign > 0 ? 'Cộng' : 'Trừ'} ${n}${n >= 10 ? (vocab === 'fingers' ? ' — tay trái trước, tay phải sau' : ' — làm cột trái trước, cột phải sau') : ''}:`, 'head', null);
    const nd = String(n).split('').map(Number).reverse();
    for (let p = nd.length - 1; p >= 0; p--) {
      if (!nd[p]) continue;
      sign > 0 ? add(p, nd[p]) : sub(p, nd[p]);
    }
  });
  return { steps, kinds, result: fromDigits(v) };
}
const abacusVocab = forceHands => (forceHands || progress.twoHands) ? 'twohand' : 'abacus';

/* Tạo đề tính toán có kiểm soát loại kỹ thuật cần dùng */
function genCalc(maker, filter, maxResult = 999) {
  for (let t = 0; t < 1500; t++) {
    const q = maker();
    let run = q.start, ok = q.start >= 0;
    for (const o of q.ops) { run += o.sign * o.n; if (run < 0) { ok = false; break; } }
    if (!ok || run > maxResult) continue;
    const plan = planCalc(q.start, q.ops);
    if (filter(plan.kinds)) return { type: 'calc', start: q.start, ops: q.ops, answer: plan.result, plan };
  }
  return null;
}
const onlyDirect = k => k.size > 0 && [...k].every(x => x === 'direct');
const needFive = k => k.has('five') && !k.has('ten');
const needTen = k => k.has('ten');

function genAnzan(count, maxN, maxTotal) {
  for (let t = 0; t < 500; t++) {
    const nums = [{ sign: 1, n: rnd(1, maxN) }];
    let run = nums[0].n, ok = true;
    for (let i = 1; i < count; i++) {
      const sign = Math.random() < .6 ? 1 : -1, n = rnd(1, maxN);
      run += sign * n; if (run < 0 || run > maxTotal) { ok = false; break; }
      nums.push({ sign, n });
    }
    if (ok) return { type: 'anzan', nums, answer: run };
  }
  return { type: 'anzan', nums: [{ sign: 1, n: 3 }, { sign: 1, n: 4 }], answer: 7 };
}
function readOptions(ans, max) {
  const set = new Set([ans]);
  const cands = [ans + 1, ans - 1, ans + 5, ans - 5, ans + 10, ans - 10, +String(ans).split('').reverse().join(''), ans + 50, ans - 50];
  for (const c of shuffle(cands)) { if (set.size >= 4) break; if (c >= 0 && c <= max && c !== ans) set.add(c); }
  while (set.size < 4) set.add(rnd(0, max));
  return shuffle([...set]);
}

const SPEEDS = { slow: { label: 'Chậm', k: 1.35 }, mid: { label: 'Vừa', k: 1 }, fast: { label: 'Nhanh', k: .65 } };

/* =========================================================
   Ứng dụng cài được (PWA): chơi khi không có mạng, cài lên màn hình chính
   ========================================================= */
const PWA = {
  prompt: null,
  standalone: (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true,
  ios: /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  canUseSW: 'serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.self === window.top
};
if (PWA.canUseSW) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.prompt = e; updateInstallUI(true); });
window.addEventListener('appinstalled', () => { PWA.prompt = null; PWA.installed = true; updateInstallUI(true); });
function updateInstallUI(rerender) {
  const b = document.getElementById('installBtn');
  if (b) b.hidden = !PWA.prompt || PWA.standalone;
  if (rerender && (state.view === 'parents' || state.view === 'home')) render();
}
function runInstall() {
  if (!PWA.prompt) { go('parents'); later(() => { const el = $('#install'); if (el) el.scrollIntoView({ block: 'start' }); }, 30); return; }
  PWA.prompt.prompt();
  PWA.prompt.userChoice.finally(() => { PWA.prompt = null; updateInstallUI(true); });
}
function installStatusHtml() {
  if (PWA.standalone) return `<div class="status-line ok">Trò chơi đang chạy như một ứng dụng đã cài. Con có thể chơi cả khi không có mạng.</div>`;
  if (PWA.installed) return `<div class="status-line ok">Đã cài xong. Hãy mở trò chơi từ biểu tượng Soroban trên màn hình chính.</div>`;
  if (PWA.prompt) return `<div class="status-line"><span>Thiết bị này cài được ngay.</span><button class="btn small" data-action="install">Cài ứng dụng</button></div>`;
  if (PWA.ios) return `<div class="status-line">Trên iPhone, iPad: làm theo hướng dẫn "iPhone, iPad" bên dưới, dùng trình duyệt Safari.</div>`;
  if (!PWA.canUseSW) return `<div class="status-line">Trang này đang mở ở chế độ xem trước nên chưa cài được. Hãy mở trò chơi từ địa chỉ web (https) của nó rồi cài.</div>`;
  return `<div class="status-line">Nếu chưa thấy nút "Cài ứng dụng", hãy dùng menu của trình duyệt như hướng dẫn bên dưới.</div>`;
}

/* =========================================================
   Trạng thái & điều hướng
   ========================================================= */
const state = { view: 'home', levelId: 1, tab: 'lesson', session: null, confirmReset: false, free: { rods: 5, show: true, tool: 'abacus' }, mental: { digits: 1, streak: 0, answer: null } };
let widgets = [];           // các bàn tính đang hiển thị
let animToken = 0;          // hủy hoạt ảnh cũ
let timers = [];
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; animToken++; };
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };

const levelById = id => LEVELS.find(l => l.id === id);
const levelStars = id => (progress.levels[id] && progress.levels[id].stars) || 0;
const isUnlocked = id => progress.unlockAll || id === 1 || levelStars(id - 1) >= 1 || levelStars(id) >= 1;
const nextLevelId = () => { const l = LEVELS.find(l => isUnlocked(l.id) && levelStars(l.id) === 0); return l ? l.id : null; };
const totalStars = () => LEVELS.reduce((s, l) => s + levelStars(l.id), 0);

function go(view, extra = {}) {
  clearTimers();
  Object.assign(state, { view }, extra);
  render();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

function render() {
  widgets = [];
  const app = $('#app');
  document.querySelectorAll('#nav button').forEach(b => {
    const to = b.dataset.to;
    const cur = (to === 'home' && (state.view === 'home' || state.view === 'level')) || to === state.view;
    if (cur) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('#starTotal').textContent = `★ ${totalStars()}/${LEVELS.length * 3}`;
  updateInstallUI(false);
  if (state.view === 'home') renderHome(app);
  else if (state.view === 'level') renderLevel(app);
  else if (state.view === 'free') renderFree(app);
  else if (state.view === 'parents') renderParents(app);
  else if (state.view === 'mental') renderMental(app);
}

/* ---------- Trang chủ ---------- */
function renderHome(app) {
  const nid = nextLevelId();
  const cards = LEVELS.map(l => {
    const un = isUnlocked(l.id), st = levelStars(l.id), nxt = l.id === nid;

      <div class="lc-name">${l.name}</div>
      <div class="lc-desc">${l.short}</div>
      <div class="lc-foot">${un ? starsHtml(st) : '<span>Khóa · cần 1 sao ở cấp trước</span>'}${nxt ? '<span class="tag-next">Học tiếp</span>' : ''}</div>
    </button>`;
  }).join('');
  app.innerHTML = `
    <section class="hero">
      <div>
        <div class="hero-jp" lang="ja">そろばん · SOROBAN</div>

        <p class="lead">10 cấp độ từ làm quen hạt tính, bàn tính trên hai bàn tay, đến tính nhẩm Anzan. Mỗi cấp có bài học minh họa cho con, hướng dẫn riêng cho bố mẹ và phần luyện tập để nhận sao.</p>
        <div class="row">
          <button class="btn" data-action="open-level" data-id="${nid || 1}">${nid && nid > 1 ? `Học tiếp cấp ${nid}` : 'Bắt đầu học'}</button>
          <button class="btn ghost" data-action="nav" data-to="parents">Hướng dẫn cho phụ huynh</button>
        </div>
      </div>
      <div class="hero-abacus">
        <div class="ab-value" id="heroVal">0</div>
        <div id="heroAbacus"></div>
        <p class="hero-note">Bấm vào hạt để gạt thử. Hạt trên = 5, mỗi hạt dưới = 1.</p>
      </div>
    </section>
    <div class="section-head"><h2>Các cấp độ</h2><p>Đạt ít nhất 1 sao để mở khóa cấp tiếp theo.</p></div>
    <div class="levels">${cards}</div>
    <div class="home-extra">
      <div class="panel"><h3>Bàn tính tự do</h3><p>Gạt thoải mái hoặc nhập một phép tính để xem máy hướng dẫn từng bước gạt hạt.</p><button class="btn soft small" data-action="nav" data-to="free">Mở bàn tính</button></div>
      <div class="panel"><h3>Dành cho bố mẹ</h3><p>Soroban là gì, lộ trình học, buổi học mẫu 15 phút, bảng bạn nhỏ – bạn lớn và tiến độ của con.</p><button class="btn soft small" data-action="nav" data-to="parents">Đọc hướng dẫn</button></div>
      ${PWA.standalone ? '' : `<div class="panel"><h3>Cài lên điện thoại</h3><p>Thêm Soroban vào màn hình chính để mở như một ứng dụng, chơi cả khi không có mạng.</p><button class="btn soft small" data-action="install">${PWA.prompt ? 'Cài ứng dụng' : 'Xem cách cài'}</button></div>`}
    </div>`;
  const val = $('#heroVal');

/* ---------- Trang cấp độ ---------- */
function handsToggle() {
  return `<button class="mode-toggle" data-action="toggle-hands" aria-pressed="${!!progress.twoHands}"><span class="sw"></span>Chế độ 2 tay</button>`;
}
const demoTool = d => d.tool === 'hands' ? Hands : Abacus;
const demoVocab = d => d.tool === 'hands' ? 'fingers' : abacusVocab(d.hands);

function renderLevel(app) {
  const L = levelById(state.levelId);
  const st = levelStars(L.id);
  const tabs = [['lesson', 'Bài học cho con'], ['guide', 'Phụ huynh đọc'], ['practice', 'Luyện tập']];
  app.innerHTML = `
    <button class="crumb" data-action="nav" data-to="home">← Tất cả cấp độ</button>
    <div class="level-head">
      <div><div class="eyebrow">Cấp ${L.id} · ${L.kyu}</div><h1>${L.name}</h1><p>${L.short}</p></div>
      <div class="head-side">${starsHtml(st)}${L.type !== 'hands' ? handsToggle() : ''}</div>
    </div>
    <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" aria-selected="${state.tab === k}" data-action="tab" data-tab="${k}">${t}</button>`).join('')}</div>
    <div id="tabBody"></div>`;
  const body = $('#tabBody');
  if (state.tab === 'lesson') renderLesson(body, L);
  else if (state.tab === 'guide') renderGuide(body, L);
  else renderPractice(body, L);
}

function renderLesson(body, L) {
  body.innerHTML = `<div class="lessons">${L.lesson.map((c, i) => `
    <article class="lesson${c.demo ? '' : ' no-demo'}">
      <div><div class="lesson-step">Bước ${i + 1} / ${L.lesson.length}</div><h3>${c.title}</h3><div class="body">${c.body.map(p => p.startsWith('<div') ? p : `<p>${p}</p>`).join('')}</div></div>
      ${c.demo ? `<div class="demo" data-demo="${i}">
        <div class="ab-value" data-val>${c.demo.kind === 'plan' ? c.demo.start : 0}</div>
        <div data-ab></div>
        ${c.demo.kind !== 'free' ? `<button class="btn small" data-action="demo-play" data-i="${i}">▶ Xem minh họa</button>` : ''}
        <div class="demo-caption" data-cap>${c.demo.kind === 'free' ? (c.demo.tool === 'hands' ? 'Con hãy bấm vào ngón tay!' : 'Con hãy bấm vào hạt!') : ''}</div>
        ${c.demo.kind === 'plan' ? '<ol class="steps" data-steps></ol>' : ''}
      </div>` : ''}
    </article>`).join('')}
    <div class="row" style="justify-content:center"><button class="btn" data-action="tab" data-tab="practice">Con đã sẵn sàng — Luyện tập</button></div>
  </div>`;
  L.lesson.forEach((c, i) => {
    if (!c.demo) return;
    const box = body.querySelector(`[data-demo="${i}"]`);
    const valEl = box.querySelector('[data-val]');
    const Tool = demoTool(c.demo);
    const ab = new Tool(box.querySelector('[data-ab]'), { rods: c.demo.rods, hands: c.demo.hands || undefined, interactive: c.demo.kind === 'free', onChange: v => { valEl.textContent = v; } });
    if (c.demo.kind === 'plan') {
      ab.setValue(c.demo.start, true);
      const plan = planCalc(c.demo.start, c.demo.ops, 5, demoVocab(c.demo));
      box.querySelector('[data-steps]').innerHTML = plan.steps.map(s => `<li class="${s.kind === 'head' ? 'head' : ''}">${s.text}</li>`).join('');
      box.querySelector('[data-cap]').textContent = `${c.demo.start} ${c.demo.ops.map(o => fmtOp(o.sign, o.n)).join(' ')} = ?`;
    }
    widgets[i] = ab;
  });
}

function playDemo(i) {
  const L = levelById(state.levelId), c = L.lesson[i], ab = widgets[i];
  const box = document.querySelector(`[data-demo="${i}"]`); if (!box || !ab) return;
  const valEl = box.querySelector('[data-val]'), cap = box.querySelector('[data-cap]');
  const token = ++animToken;
  const alive = () => token === animToken;
  if (c.demo.kind === 'seq') {
    c.demo.values.forEach((v, k) => later(() => {
      if (!alive()) return;
      ab.setValue(v, true); valEl.textContent = v; Sound.click();
      cap.textContent = v === 0 ? 'Số 0' : `${v} — ${readVi(v)}`;
    }, k * 1300));
  } else if (c.demo.kind === 'plan') {
    const plan = planCalc(c.demo.start, c.demo.ops, 5, demoVocab(c.demo));
    const lis = box.querySelectorAll('[data-steps] li');
    lis.forEach(li => li.classList.remove('cur', 'done'));
    plan.steps.forEach((s, k) => later(() => {
      if (!alive()) return;
      ab.setDigits(s.digits); ab.flashRod(s.rod); valEl.textContent = fromDigits(s.digits.slice(0, ab.rods));
      if (s.kind !== 'head') Sound.click();
      lis.forEach((li, j) => { li.classList.toggle('cur', j === k); li.classList.toggle('done', j < k); });
      cap.innerHTML = s.text;
      if (k === plan.steps.length - 1) later(() => { if (!alive()) return; ab.flashRod(null); cap.innerHTML = `Kết quả: <b>${plan.result}</b>`; lis.forEach(li => { li.classList.remove('cur'); li.classList.add('done'); }); }, 1600);
    }, k * 1700));
  }
}

function renderGuide(body, L) {
  const g = L.guide;
  body.innerHTML = `<div class="guide">
    <div class="panel full"><h3>Mục tiêu của cấp này</h3><p style="color:var(--ink)">${g.goal}</p><span class="pill">Thời gian gợi ý: ${g.time}</span></div>
    <div class="panel"><h3>Cách hướng dẫn con</h3><ol>${g.steps.map(s => `<li>${s}</li>`).join('')}</ol></div>
    <div class="panel" style="display:grid;gap:16px;align-content:start">
      <div><h3>Lỗi thường gặp</h3><ul>${g.mistakes.map(s => `<li>${s}</li>`).join('')}</ul></div>
      <div><h3>Câu nói gợi ý</h3><ul class="quote-list">${g.say.map(s => `<li>${s}</li>`).join('')}</ul></div>
    </div>
    <div class="panel full"><h3>Cách tính điểm</h3><p>Mỗi lượt luyện tập có ${L.count} câu. Chỉ những câu con làm đúng <b>ngay lần đầu, không dùng gợi ý</b> mới được tính. Từ 90% đúng: 3 sao · từ 70%: 2 sao · từ 50%: 1 sao (mở khóa cấp sau). Con có thể chơi lại nhiều lần; trò chơi lưu số sao cao nhất.</p></div>
  </div>`;
}

/* ---------- Luyện tập ---------- */
function makeSession(L) {
  const qs = []; let tries = 0;
  while (qs.length < L.count && tries < 200) {
    tries++;
    const q = L.gen(qs.length); if (!q) continue;
    const key = JSON.stringify([q.answer, q.start, q.ops, q.nums]);
    if (qs.some(x => x.key === key)) continue;
    q.key = key; qs.push(q);
  }
  return { levelId: L.id, qs, idx: 0, score: 0, attempts: 0, hinted: false, solved: false, phase: 'intro', typed: '' };
}

function renderPractice(body, L) {
  const S = state.session && state.session.levelId === L.id ? state.session : null;
  if (!S || S.phase === 'intro') {
    const best = progress.levels[L.id];
    body.innerHTML = `<div class="practice"><div class="qcard">
      <div class="q-label">Luyện tập cấp ${L.id}</div>
      <h2 style="font-size:1.8rem">${L.name}</h2>
      <p style="color:var(--muted);max-width:44ch">${practiceIntro(L)}</p>
      ${L.type === 'anzan' ? speedPicker() : ''}
      ${best ? `<p>Kỷ lục: ${starsHtml(best.stars)} · ${best.best}/${L.count} câu đúng</p>` : ''}
      <button class="btn" data-action="start-practice">Bắt đầu ${L.count} câu</button>
    </div></div>`;
    return;
  }
  if (S.phase === 'done') return renderResult(body, L, S);
  const q = S.qs[S.idx];
  const pct = (S.idx / S.qs.length) * 100;
  body.innerHTML = `<div class="practice">
    <div class="pbar"><div class="pbar-top"><span>Câu ${S.idx + 1} / ${S.qs.length}</span><span>Đúng: ${S.score}</span></div><div class="pbar-track"><div class="pbar-fill" style="width:${pct}%"></div></div></div>
    <div class="qcard" id="qcard"></div>
  </div>`;
  const card = $('#qcard');
  if (q.type === 'set' || q.type === 'hand-set') renderSetQ(card, L, S, q);
  else if (q.type === 'read') renderReadQ(card, L, S, q);
  else if (q.type === 'calc' || q.type === 'hand-calc') renderCalcQ(card, L, S, q);
  else renderAnzanQ(card, L, S, q);
  if (S.solved) { if (S.lastFeedback) feedback(S.lastFeedback[0], S.lastFeedback[1]); if (widgets[0]) widgets[0].setInteractive(false); showNext(S); }
  else if (S.hinted && $('#hintBox')) showHint(true);
}
function practiceIntro(L) {
  return {
    set: 'Máy đọc một số, con đặt số đó lên bàn tính rồi bấm "Kiểm tra". Số trên bàn tính được ẩn để con tự quan sát hạt.',
    read: 'Bàn tính hiện một số. Con nhìn hạt và chọn đáp án đúng.',
    calc: 'Bàn tính đã có sẵn số thứ nhất. Con gạt tiếp phép tính rồi bấm "Kiểm tra". Bí thì bấm "Gợi ý".',
    hands: 'Tay phải là cột đơn vị, tay trái là cột chục. Bấm vào ngón tay để giơ lên hoặc gập xuống. 3 câu đầu con tạo số, các câu sau con cộng trừ trên hai bàn tay. Con làm cùng trên tay thật của mình nhé!',
    anzan: 'Các số lần lượt hiện lên. Con tưởng tượng bàn tính trong đầu, gạt theo, rồi nhập kết quả.'
  }[L.type];
}
function speedPicker() {
  return `<div style="display:grid;gap:6px;justify-items:center"><span class="q-label">Tốc độ chiếu số</span><div class="seg" role="group">${Object.entries(SPEEDS).map(([k, s]) => `<button data-action="speed" data-speed="${k}" aria-pressed="${progress.speed === k}">${s.label}</button>`).join('')}</div></div>`;
}

function practiceButtons(extra = '') {
  return `<div class="row" style="justify-content:center">${extra}<button class="btn" data-action="check" id="checkBtn">Kiểm tra</button></div>`;
}
function renderSetQ(card, L, S, q) {
  const onHands = q.type === 'hand-set';

function playFlash() {
  const L = levelById(state.levelId), S = state.session, q = S.qs[S.idx];
  const stage = $('#stage'); if (!stage) return;
  $('#answerArea').hidden = true;
  const token = ++animToken, alive = () => token === animToken;
  const ms = Math.round(L.flashBase * SPEEDS[progress.speed].k);
  const seq = [['3', 'plain'], ['2', 'plain'], ['1', 'plain']].map(x => ({ t: x[0], c: '' , cd: true }))
    .concat(q.nums.map((o, i) => ({ t: i === 0 ? String(o.n) : fmtOp(o.sign, o.n), c: o.sign > 0 ? 'plus' : 'minus' })));
  let at = 0;
  seq.forEach(item => {
    later(() => { if (!alive()) return; stage.innerHTML = `<div class="flash-num pop ${item.c}" style="${item.cd ? 'color:var(--muted);font-size:3rem' : ''}">${item.t}</div>`; if (!item.cd) Sound.click(); }, at);
    at += item.cd ? 600 : ms;
    if (!item.cd) later(() => { if (!alive()) return; stage.innerHTML = ''; }, at - 180);
  });
  later(() => {
    if (!alive()) return;
    stage.innerHTML = `<div style="color:var(--muted);font-weight:600">Kết quả là bao nhiêu?</div>`;
    $('#answerArea').hidden = false;
    const inp = $('#ans'); inp.focus({ preventScroll: true });
  }, at + 100);
}

function feedback(cls, html) { const fb = $('#fb'); if (fb) { fb.className = 'feedback ' + cls; fb.innerHTML = html; } if (state.session) state.session.lastFeedback = [cls, html]; }
function showNext(S) {

  $('#nextBtn').focus({ preventScroll: true });
  const cb = $('#checkBtn'); if (cb) cb.disabled = true;
}
const PRAISE = ['Chính xác!', 'Giỏi quá!', 'Tuyệt vời!', 'Đúng rồi!', 'Xuất sắc!'];

function checkAnswer() {
  const S = state.session; if (!S || S.solved) return;
  const q = S.qs[S.idx];
  let val;
  if (q.type === 'anzan') {
    const inp = $('#ans'); if (!inp || inp.value === '') { feedback('info', 'Con nhập kết quả trước nhé.'); return; }
    val = +inp.value;
  } else val = widgets[0].getValue();
  S.attempts++;
  if (val === q.answer) {
    S.solved = true;
    if (S.attempts === 1 && !S.hinted) S.score++;
    Sound.good();
    feedback('ok', `${pick(PRAISE)} Kết quả là ${q.answer}.${S.attempts > 1 || S.hinted ? ' (Câu này không tính điểm vì đã thử lại hoặc dùng gợi ý.)' : ''}`);
    if (widgets[0]) widgets[0].setInteractive(false);
    showNext(S);
    return;
  }
  Sound.bad();
  if (q.type === 'anzan') {
    S.solved = true;
    feedback('no', `Chưa đúng. Đáp án là <b>${q.answer}</b>: ${q.nums.map((o, i) => i === 0 ? o.n : fmtOp(o.sign, o.n)).join(' ')} = ${q.answer}`);
    showNext(S);
    return;
  }
  if (S.attempts >= 3) {
    S.solved = true;
    feedback('no', `Chưa đúng. Đáp án là <b>${q.answer}</b>. Bàn tính đang là ${val}.`);
    if (q.type === 'calc' || q.type === 'hand-calc') showHint(true);
    widgets[0].setValue(q.answer, true); widgets[0].setInteractive(false);
    showNext(S);
    return;
  }
  const msg = q.type === 'set' ? `Chưa đúng — bàn tính của con đang là <b>${val}</b>. Con thử lại nhé!` : `Chưa đúng — bàn tính của con đang là <b>${val}</b>. Bấm "Làm lại" hoặc "Gợi ý" nhé!`;
  feedback('no', msg);
}
function showHint(silent) {
  const S = state.session, q = S.qs[S.idx];
  if (!silent) S.hinted = true;
  const box = $('#hintBox'); if (!box) return;
  const onHands = q.type === 'hand-calc';
  const plan = planCalc(q.start, q.ops, 5, onHands ? 'fingers' : abacusVocab());
  box.innerHTML = `<div class="hint-box"><h4>${onHands ? 'Các bước với ngón tay' : 'Các bước gạt hạt'}</h4><ol class="steps">${plan.steps.map(s => `<li class="${s.kind === 'head' ? 'head' : ''}">${s.text}</li>`).join('')}</ol></div>`;
}

function chooseOption(btn) {
  const S = state.session; if (!S || S.solved) return;
  const q = S.qs[S.idx], v = +btn.dataset.v;
  S.attempts++;
  if (v === q.answer) {
    btn.classList.add('right'); S.solved = true;
    if (S.attempts === 1) S.score++;
    Sound.good();
    feedback('ok', `${pick(PRAISE)} Đây là số ${q.answer} — ${readVi(q.answer)}.`);
    showNext(S);
  } else {
    btn.classList.add('wrong'); btn.disabled = true; Sound.bad();
    feedback('no', 'Chưa đúng. Con đếm lại hạt ở từng cột nhé!');
  }
}

function nextQuestion() {
  const S = state.session; if (!S) return;
  clearTimers();
  if (S.idx >= S.qs.length - 1) {
    S.phase = 'done';
    const L = levelById(S.levelId);
    const pct = S.score / S.qs.length;
    S.stars = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .5 ? 1 : 0;
    const prev = progress.levels[L.id] || { stars: 0, best: 0, plays: 0 };
    const wasLocked = !isUnlocked(L.id + 1);
    progress.levels[L.id] = { stars: Math.max(prev.stars, S.stars), best: Math.max(prev.best, S.score), plays: (prev.plays || 0) + 1, last: new Date().toISOString().slice(0, 10) };
    S.unlockedNew = wasLocked && L.id < LEVELS.length && isUnlocked(L.id + 1);
    saveProgress();
    if (S.stars > 0) Sound.win();
  } else {
    Object.assign(S, { idx: S.idx + 1, attempts: 0, hinted: false, solved: false, lastFeedback: null });
  }
  render();
}

function freeDemo() {
  const F = state.free, ab = widgets[0], onHands = F.tool === 'hands';
  const a = Math.floor(+$('#fa').value), b = Math.floor(+$('#fb2').value), sign = +$('#fop').value;
  const err = $('#freeErr'); err.textContent = '';
  const max = Math.pow(10, ab.rods) - 1;
  if (!(a >= 0) || !(b >= 0)) { err.textContent = 'Hãy nhập hai số không âm.'; return; }
  if (sign < 0 && b > a) { err.textContent = 'Số trừ lớn hơn số bị trừ — hãy đổi lại để kết quả không âm.'; return; }
  if (a > max || b > max || a + sign * b > max) {
    err.textContent = onHands ? 'Hai bàn tay chỉ biểu diễn được tới 99. Hãy chọn số nhỏ hơn.' : `Bàn tính ${ab.rods} cột chỉ chứa được tới ${max}. Chọn thêm cột hoặc số nhỏ hơn.`;
    return;
  }
  const plan = planCalc(a, [{ sign, n: b }], ab.rods, onHands ? 'fingers' : abacusVocab());
  const list = $('#freeSteps'), cap = $('#freeCap'), valEl = $('#freeVal');
  list.innerHTML = plan.steps.map(s => `<li class="${s.kind === 'head' ? 'head' : ''}">${s.text}</li>`).join('');
  const lis = list.querySelectorAll('li');
  clearTimers();
  const token = ++animToken, alive = () => token === animToken;
  ab.setInteractive(false);
  plan.steps.forEach((s, k) => later(() => {
    if (!alive()) return;
    ab.setDigits(s.digits); ab.flashRod(s.rod);
    if (F.show) valEl.textContent = fromDigits(s.digits.slice(0, ab.rods));
    if (s.kind !== 'head') Sound.click();
    lis.forEach((li, j) => { li.classList.toggle('cur', j === k); li.classList.toggle('done', j < k); });
    cap.innerHTML = s.text;
    if (k === plan.steps.length - 1) later(() => { if (!alive()) return; ab.flashRod(null); ab.setInteractive(true); cap.innerHTML = `${a} ${sign > 0 ? '+' : '−'} ${b} = <b>${plan.result}</b>`; }, 1500);
  }, k * 1600));
}

}
function mentalDemo() {
  const { ab, hd } = state.mentalWidgets;
  const plan = planCalc(MENTAL_DEMO.start, MENTAL_DEMO.ops, 2, 'abacus');
  const fplan = planCalc(MENTAL_DEMO.start, MENTAL_DEMO.ops, 2, 'fingers');
  const lis = $('#mdSteps').querySelectorAll('li'), flis = $('#mdFSteps').querySelectorAll('li'), cap = $('#mdCap');
  clearTimers();
  const token = ++animToken, alive = () => token === animToken;
  $('#mdRes').textContent = '?';
  plan.steps.forEach((s, k) => later(() => {
    if (!alive()) return;
    ab.setDigits(s.digits); hd.setDigits(s.digits); ab.flashRod(s.rod); hd.flashRod(s.rod);
    if (s.kind !== 'head') Sound.click();
    [lis, flis].forEach(list => list.forEach((li, j) => { li.classList.toggle('cur', j === k); li.classList.toggle('done', j < k); }));
    cap.innerHTML = fplan.steps[k].text;
    if (k === plan.steps.length - 1) later(() => { if (!alive()) return; ab.flashRod(null); hd.flashRod(null); $('#mdRes').textContent = plan.result; cap.innerHTML = 'Giờ con nhắm mắt, tự kể lại các bước này nhé!'; }, 1600);
  }, k * 1900));
}
function flashShow() {
  const M = state.mental, { fx } = state.mentalWidgets;
  const n = rnd(M.digits === 1 ? 1 : Math.pow(10, M.digits - 1), Math.pow(10, M.digits) - 1);
  M.answer = n;
  fx.setValue(n, true);
  clearTimers();
  const token = ++animToken, alive = () => token === animToken;
  $('#fxCover').hidden = true; $('#fxAns').hidden = true; $('#fxCheck').hidden = true; $('#fxShow').hidden = true;
  const fb = $('#fxFb'); fb.className = 'feedback'; fb.textContent = '';
  later(() => {
    if (!alive()) return;
    $('#fxCover').hidden = false; $('#fxAns').hidden = false; $('#fxCheck').hidden = false;
    const inp = $('#fxAns'); inp.value = ''; inp.focus({ preventScroll: true });
  }, 900 + M.digits * 500);
}
function flashCheck() {
  const M = state.mental, inp = $('#fxAns');
  if (M.answer == null || inp.value === '') return;
  const ok = +inp.value === M.answer, fb = $('#fxFb');
  $('#fxCover').hidden = true;
  if (ok) { M.streak++; Sound.good(); fb.className = 'feedback ok'; fb.textContent = `${pick(PRAISE)} Đó là số ${M.answer}.`; }
  else { M.streak = 0; Sound.bad(); fb.className = 'feedback no'; fb.textContent = `Hình vừa rồi là số ${M.answer}. Con nhìn lại bàn tính và thử lần nữa nhé!`; }
  if (M.streak > (progress.flashBest || 0)) { progress.flashBest = M.streak; saveProgress(); }
  $('#fxStreak').textContent = M.streak; $('#fxBest').textContent = progress.flashBest || 0;
  M.answer = null;
  $('#fxAns').hidden = true; $('#fxCheck').hidden = true;
  const show = $('#fxShow'); show.hidden = false; show.textContent = 'Chiếu hình tiếp'; show.focus({ preventScroll: true });
}

      go('level', { levelId: id, tab: 'lesson', session: null }); break;
    }
    case 'tab': clearTimers(); state.tab = t.dataset.tab; if (state.tab === 'practice' && state.session && state.session.levelId !== state.levelId) state.session = null; render(); break;
    case 'demo-play': playDemo(+t.dataset.i); break;
    case 'start-practice': { clearTimers(); const L = levelById(state.levelId); state.session = makeSession(L); state.session.phase = 'q'; state.tab = 'practice'; render(); break; }
    case 'speed': progress.speed = t.dataset.speed; saveProgress(); render(); break;
    case 'check': checkAnswer(); break;
    case 'clear': {
      const S = state.session, q = S && S.qs[S.idx]; if (!q || S.solved) return;
      widgets[0].setValue(q.type === 'calc' || q.type === 'hand-calc' ? q.start : 0, true); feedback('', ''); break;
    }
    case 'hint': showHint(false); feedback('info', 'Làm theo từng dòng nhé. Câu này sẽ không được tính điểm.'); break;
    case 'choose': chooseOption(t); break;
    case 'next': nextQuestion(); break;
    case 'anzan-go': playFlash(); break;
    case 'key': {
      const inp = $('#ans'); if (!inp) return;
      if (t.dataset.k === 'back') inp.value = inp.value.slice(0, -1);
      else if (inp.value.length < 4) inp.value += t.dataset.k;
      break;
    }
    case 'free-clear': clearTimers(); widgets[0].setInteractive(true); widgets[0].flashRod(null); widgets[0].setValue(0); $('#freeCap').textContent = ''; break;
    case 'free-toggle': {
      state.free.show = !state.free.show;
      const v = $('#freeVal'); v.classList.toggle('hidden-val', !state.free.show);
      v.textContent = state.free.show ? widgets[0].getValue() : 'Số đang ẩn';
      t.textContent = state.free.show ? 'Ẩn số' : 'Hiện số'; break;
    }
    case 'free-rods': clearTimers(); state.free.rods = +t.dataset.n; render(); break;
    case 'free-demo': freeDemo(); break;
    case 'install': runInstall(); break;
    case 'free-tool': clearTimers(); state.free.tool = t.dataset.tool; render(); break;
    case 'toggle-hands': {
      clearTimers();
      const S = state.session, practicing = state.view === 'level' && state.tab === 'practice' && S && S.phase === 'q';
      const keep = practicing && widgets[0] && !S.solved ? widgets[0].getValue() : null;
      progress.twoHands = !progress.twoHands; saveProgress(); render();
      if (keep != null && widgets[0]) widgets[0].setValue(keep, true);
      break;
    }
    case 'mental-demo': mentalDemo(); break;
    case 'flash-digits': clearTimers(); state.mental.digits = +t.dataset.n; state.mental.answer = null; render(); break;
    case 'flash-show': flashShow(); break;
    case 'flash-check': flashCheck(); break;
    case 'toggle-sound': progress.sound = !progress.sound; saveProgress(); render(); break;
    case 'unlock-all': progress.unlockAll = !progress.unlockAll; saveProgress(); render(); break;
    case 'reset-ask': state.confirmReset = true; render(); break;
    case 'reset-cancel': state.confirmReset = false; render(); break;
    case 'reset-confirm': progress = Object.assign(loadProgress(), { levels: {}, unlockAll: false }); saveProgress(); state.confirmReset = false; state.session = null; render(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
    const nb = $('#nextBtn'); if (nb) { e.preventDefault(); nb.click(); }
  }
});

render();
</script>
</body>
</html>
